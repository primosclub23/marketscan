<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FAF2E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sazón">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Sazón — tu menú semanal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Sacramento&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F0E8;--surface:#EDE7DA;--elevated:#E0D8C8;--border:rgba(0,0,0,.10);
  --text:#1A1810;--muted:#6B6050;--hint:#9B8C78;--accent:#9B5E3A;--accent-dark:#7A4A2A;
  --serif:'Playfair Display',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace;
  --spring:cubic-bezier(.2,.9,.25,1.12);--ease:cubic-bezier(.22,.8,.3,1);
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:calc(var(--st) + 22px) 18px calc(var(--sb) + 150px);position:relative}
.enter>*{animation:rise .55s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(calc(var(--r,0deg) + 4deg))}}

/* tipografía */
.lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
h1{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.06;letter-spacing:-.01em;margin:6px 0 4px}
h1 em,h2 em,h3 em{font-style:italic;font-weight:400;color:var(--accent)}
h2{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1.15}
.sub{color:var(--muted);font-weight:300;font-size:14px;line-height:1.6}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 10px}
.sec::after{content:'';flex:1;height:.5px;background:var(--elevated)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:100px;padding:15px 24px;font-size:14px;font-weight:500;transition:transform .18s var(--spring),opacity .2s,background .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.solid{background:var(--text);color:var(--bg)}
.ghost{border:.5px solid rgba(0,0,0,.18);color:var(--muted)}
.acc{background:var(--accent);color:var(--bg)}
.wide{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:.5px solid var(--border);font-size:16px;transition:transform .18s var(--spring);flex-shrink:0}
.ico:active{transform:scale(.88)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.hs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.hs::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:.5px solid rgba(0,0,0,.14);border-radius:100px;padding:9px 15px;font-size:13px;color:var(--muted);background:transparent;transition:background .25s,color .25s,transform .2s var(--spring),border-color .25s;white-space:nowrap;flex-shrink:0}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-dark);background:rgba(155,94,58,.09);border:.5px solid rgba(155,94,58,.25);border-radius:100px;padding:3px 9px;white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap}

/* tarjeta presupuesto */
.bud{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:16px 18px;margin-top:16px}
.bud .big{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.bud .row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:5px;border-radius:5px;background:var(--elevated);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--text);width:0;transition:width .9s var(--ease),background .3s}
.bud.over .bar i{background:var(--accent)}
.bud.over .big{color:var(--accent)}

/* tira de días */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:18px 0 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 0 8px;border-radius:100px;border:.5px solid transparent;transition:background .3s,color .3s,transform .25s var(--spring)}
.day b{font-family:var(--serif);font-size:17px;font-weight:700}
.day .lab{font-size:9px}
.day.off{opacity:.38}
.day.on{background:var(--text);color:var(--bg);transform:translateY(-2px)}
.day.on .lab{color:var(--elevated)}
.day.today:not(.on){border-color:rgba(155,94,58,.45)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:18px 0 0}
#daybody{touch-action:pan-y}
#daybody.sl{animation:sl .38s var(--ease) both}#daybody.sr{animation:sr .38s var(--ease) both}
@keyframes sl{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes sr{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.slot{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 7px}

/* tarjetas de plato */
.card{display:flex;gap:13px;align-items:center;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:11px;position:relative;transition:transform .2s var(--spring),opacity .17s;cursor:pointer;animation:rise .5s var(--ease) both}
.card:active{transform:scale(.985)}
.card.out{transform:rotateX(80deg) scale(.96);opacity:0}
.card.flipin{animation:flipin .45s var(--spring) both}
@keyframes flipin{from{transform:rotateX(-70deg) scale(.96);opacity:0}to{transform:none;opacity:1}}
.art{width:72px;height:72px;border-radius:10px;display:grid;place-items:center;font-size:36px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.55),transparent 60%),var(--c,#E3C9B8);flex-shrink:0;border:.5px solid rgba(0,0,0,.06)}
.ci{flex:1;min-width:0}
.ci h3{font-family:var(--serif);font-size:16px;font-weight:700;line-height:1.2;margin:5px 0 3px}
.meta{font-size:12px;color:var(--hint)}
.meta b{color:var(--text);font-weight:500}
.done h3{text-decoration:line-through;text-decoration-thickness:.5px;color:var(--muted)}
.empty{border:.5px dashed rgba(0,0,0,.2);border-radius:12px;padding:18px;text-align:center;color:var(--hint);font-size:13px}
.free{text-align:center;padding:46px 20px}
.free .e{font-size:54px;display:inline-block;animation:float 4s ease-in-out infinite}

/* barra inferior */
#tabs{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);width:min(444px,calc(100% - 28px));background:rgba(237,231,218,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:.5px solid var(--border);border-radius:100px;padding:5px;display:grid;grid-template-columns:repeat(4,1fr);z-index:20;box-shadow:0 10px 30px -12px rgba(26,24,16,.28);transition:transform .45s var(--ease),opacity .3s}
#tabs.hide{transform:translate(-50%,140%);opacity:0}
#tabs::before{content:'';position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/4);border-radius:100px;background:var(--text);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s var(--spring)}
#tabs button{position:relative;padding:11px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:color .3s}
#tabs button span{font-size:17px;line-height:1.1;transition:transform .35s var(--spring)}
#tabs button.on{color:var(--bg)}
#tabs button.on span{transform:scale(1.15)}
.badge{position:absolute;top:4px;right:22%;min-width:17px;height:17px;border-radius:17px;background:var(--accent);color:var(--bg);font-size:9px;display:grid;place-items:center;padding:0 4px}

/* hojas */
.layer{position:fixed;inset:0;z-index:40;pointer-events:none}
#l2{z-index:50}
.scrim{position:absolute;inset:0;background:rgba(26,24,16,.42);opacity:0;transition:opacity .35s}
.sheet{position:absolute;left:50%;bottom:0;width:min(480px,100%);max-height:94%;transform:translate(-50%,104%);background:var(--bg);border-radius:22px 22px 0 0;transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -20px 50px -20px rgba(26,24,16,.35)}
.sheet.full{height:100%;max-height:100%;border-radius:0}
.layer.on{pointer-events:auto}.layer.on .scrim{opacity:1}.layer.on .sheet{transform:translate(-50%,0)}
.grab{padding:10px 0 6px;display:grid;place-items:center;touch-action:none;cursor:grab;flex-shrink:0}
.grab i{width:38px;height:4px;border-radius:4px;background:var(--elevated)}
.sbody{overflow-y:auto;padding:4px 20px 26px;flex:1;-webkit-overflow-scrolling:touch}
.sfoot{display:flex;gap:10px;padding:12px 18px calc(var(--sb) + 14px);border-top:.5px solid var(--border);background:var(--bg);flex-shrink:0}
.sfoot .btn{flex:1}

/* detalle */
.hero{height:200px;border-radius:16px;display:grid;place-items:center;font-size:104px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.6),transparent 60%),var(--c);position:relative;border:.5px solid rgba(0,0,0,.06)}
.hero span{animation:float 5s ease-in-out infinite;filter:drop-shadow(0 14px 14px rgba(26,24,16,.22))}
.hero .ico{position:absolute;top:12px;right:12px;background:var(--bg)}
.hero .price{position:absolute;left:12px;top:12px;background:var(--bg);border-radius:100px;padding:8px 14px;font-size:13px;font-weight:500;border:.5px solid var(--border)}
.heart.on{animation:pop .45s var(--spring)}
.stats{display:grid;grid-template-columns:1.3fr 1fr 1fr;background:var(--surface);border:.5px solid var(--border);border-radius:12px;margin:16px 0 0}
.stats>div{padding:14px 8px;text-align:center}
.stats>div+div{border-left:.5px solid var(--border)}
.stats b{display:block;font-family:var(--serif);font-size:21px;line-height:1.2}
.step{display:inline-flex;align-items:center;gap:12px}
.step button{width:30px;height:30px;border-radius:50%;background:var(--bg);border:.5px solid var(--border);font-size:16px;transition:transform .15s var(--spring)}
.step button:active{transform:scale(.82)}
.step b{min-width:22px;display:inline-block}
.tick{animation:tick .3s var(--spring)}
@keyframes tick{from{transform:translateY(7px);opacity:0}to{transform:none;opacity:1}}
.macro{display:flex;gap:4px;margin:14px 0 8px}
.macro i{height:7px;border-radius:7px;width:0;transition:width .9s var(--ease) .2s}
.mleg{display:grid;grid-template-columns:repeat(3,1fr);font-size:12px;color:var(--muted)}
.mleg b{color:var(--text);font-weight:500}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:100px;padding:4px;position:relative;margin:22px 0 12px;border:.5px solid var(--border)}
.seg::before{content:'';position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--text);border-radius:100px;transition:transform .4s var(--spring);transform:translateX(calc(var(--i,0)*100%))}
.seg button{position:relative;padding:11px;font-size:13px;font-weight:500;color:var(--muted);transition:color .3s}
.seg button.on{color:var(--bg)}
.ing{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:.5px solid var(--elevated);font-size:14px}
.ing .e{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:17px;flex-shrink:0}
.ing .n{flex:1}
.ing .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pstep{display:flex;gap:14px;padding:13px 0;border-bottom:.5px solid var(--elevated)}
.pstep .num{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--accent);line-height:1;min-width:26px}
.pstep p{font-weight:300;color:var(--muted);line-height:1.65}

/* lista */
.row{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:.5px solid var(--elevated);cursor:pointer;transition:opacity .4s}
.ck{width:24px;height:24px;border-radius:50%;border:.5px solid rgba(0,0,0,.3);display:grid;place-items:center;flex-shrink:0;transition:background .3s,border-color .3s,transform .3s var(--spring)}
.ck svg{width:12px;height:12px;stroke:var(--bg);stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s var(--ease) .08s}
.row.on .ck{background:var(--text);border-color:var(--text);transform:scale(1.08)}
.row.on .ck svg{stroke-dashoffset:0}
.row.on{opacity:.45}
.row .n{flex:1;min-width:0;position:relative}
.row .n span{background:linear-gradient(var(--text),var(--text)) left center/0 .5px no-repeat;transition:background-size .4s var(--ease)}
.row.on .n span{background-size:100% .5px}
.row .q{color:var(--hint);font-size:12px;white-space:nowrap}
.row .p{font-variant-numeric:tabular-nums;font-weight:500;min-width:52px;text-align:right;font-size:13px}
.go{width:30px;height:30px;border-radius:50%;border:.5px solid var(--border);display:grid;place-items:center;text-decoration:none;font-size:13px;color:var(--accent);flex-shrink:0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 84px);width:min(444px,calc(100% - 28px));display:flex;gap:8px;z-index:19;animation:rise .5s var(--ease) .3s both}
.fab .btn{box-shadow:0 12px 26px -12px rgba(26,24,16,.45)}
.note{font-size:12px;color:var(--hint);font-weight:300;line-height:1.6;margin-top:10px}

/* descubrir */
.search{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:100px;padding:13px 18px;font:inherit;color:var(--text);outline:none;margin:14px 0 12px}
.search::placeholder{color:var(--hint)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.gc{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:9px 9px 12px;cursor:pointer;animation:rise .5s var(--ease) both;transition:transform .2s var(--spring)}
.gc:active{transform:scale(.97)}
.gc .art{width:100%;height:104px;font-size:50px;margin-bottom:9px}
.gc h3{font-family:var(--serif);font-size:14.5px;line-height:1.22;margin-bottom:4px}

/* formularios */
.inp{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px;color:var(--text);outline:none;min-width:0}
.inp:focus{border-color:rgba(0,0,0,.4)}
.inp::placeholder{color:var(--hint)}
textarea.inp{min-height:120px;resize:vertical;line-height:1.5}
.frow{display:grid;grid-template-columns:1fr 64px 62px 30px;gap:6px;margin-bottom:6px;align-items:center}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f3 label{display:block}
.tupb{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);border:.5px solid rgba(0,0,0,.14);border-radius:100px;padding:3px 9px;transition:all .25s var(--spring)}
.tupb.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tip{background:rgba(155,94,58,.08);border:.5px solid rgba(155,94,58,.25);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--accent-dark);margin-top:14px;line-height:1.55}
/* ajustes y onboarding */
.box{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:16px}
.line{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bignum{font-family:var(--serif);font-weight:700;font-size:76px;line-height:1;text-align:center;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.bignum sup{font-size:26px;vertical-align:top;margin-left:4px;color:var(--accent);font-style:italic;font-weight:400}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:5px;background:linear-gradient(var(--text),var(--text)) 0/var(--p,50%) 100% no-repeat,var(--elevated);outline:none;margin:22px 0 8px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--bg);border:.5px solid var(--text);box-shadow:0 4px 12px -4px rgba(26,24,16,.5);cursor:grab}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--bg);border:.5px solid var(--text)}
.meal{display:flex;align-items:center;gap:14px;padding:14px 16px;border:.5px solid var(--border);border-radius:12px;background:transparent;width:100%;text-align:left;margin-bottom:9px;transition:background .3s,transform .2s var(--spring),border-color .3s}
.meal:active{transform:scale(.98)}
.meal .e{font-size:28px;transition:transform .4s var(--spring)}
.meal div{flex:1}
.meal b{font-family:var(--serif);font-size:17px;display:block}
.meal small{color:var(--hint);font-size:12px}
.meal.on{background:var(--surface);border-color:rgba(0,0,0,.3)}
.meal.on .e{transform:scale(1.18) rotate(-6deg)}
.meal .ck{border-color:rgba(0,0,0,.25)}
.meal.on .ck{background:var(--text);border-color:var(--text)}.meal.on .ck svg{stroke-dashoffset:0}
.dpills{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dp{padding:16px 0 12px;border-radius:100px;border:.5px solid rgba(0,0,0,.14);display:flex;flex-direction:column;align-items:center;gap:9px;font-family:var(--serif);font-weight:700;font-size:16px;transition:background .3s,color .3s,transform .3s var(--spring)}
.dp .ck{width:20px;height:20px}
.dp.on{background:var(--text);color:var(--bg);transform:translateY(-4px)}
.dp.on .ck{background:var(--bg);border-color:var(--bg)}.dp.on .ck svg{stroke:var(--text);stroke-dashoffset:0}
.ob{min-height:calc(100vh - var(--st) - var(--sb) - 60px);display:flex;flex-direction:column}
.ob .top{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.prog{flex:1;display:flex;gap:5px}
.prog i{flex:1;height:3px;border-radius:3px;background:var(--elevated);overflow:hidden;position:relative}
.prog i::after{content:'';position:absolute;inset:0;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.prog i.on::after{transform:scaleX(1)}
.ob .mid{flex:1;margin-top:22px}
.ob .foot{position:sticky;bottom:calc(var(--sb) + 16px);padding-top:16px}
.welcome{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:22px}
.plate{width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FBF8F1,var(--surface) 70%);border:.5px solid var(--border);position:relative;display:grid;place-items:center;font-size:92px;box-shadow:0 30px 50px -30px rgba(26,24,16,.4), inset 0 0 0 22px rgba(245,240,232,.7), inset 0 0 0 22.5px rgba(0,0,0,.06)}
.plate>span{animation:float 5s ease-in-out infinite}
.plate i{position:absolute;font-style:normal;font-size:38px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 8px 8px rgba(26,24,16,.18))}
.gen{position:fixed;inset:0;background:var(--bg);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:30px;text-align:center;animation:rise .4s both}
.pot{font-size:96px;position:relative;animation:wob 1.1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(-3px)}}
.pot i{position:absolute;left:50%;top:-6px;width:8px;height:26px;border-radius:8px;background:var(--elevated);animation:steam 1.6s ease-out infinite}
.pot i:nth-child(2){margin-left:-24px;animation-delay:.4s}.pot i:nth-child(3){margin-left:18px;animation-delay:.8s}
@keyframes steam{from{transform:translateY(0) scaleY(.5);opacity:.9}to{transform:translateY(-42px) scaleY(1.3);opacity:0}}
.gen .bar{width:220px}

/* modo cocina */
.cook{padding:calc(var(--st) + 18px) 24px 10px;flex:1;display:flex;flex-direction:column;overflow-y:auto}
.cook .txt{font-family:var(--serif);font-size:27px;line-height:1.32;font-weight:700;margin:auto 0;padding:26px 0;animation:rise .45s var(--ease) both}
.cook .ghostnum{font-family:var(--serif);font-style:italic;font-size:140px;line-height:.8;opacity:.08;position:absolute;right:18px;top:calc(var(--st) + 70px);pointer-events:none}
.timer{align-self:flex-start;font-variant-numeric:tabular-nums}
.timer.run{background:var(--accent);color:var(--bg);border-color:transparent}
.timer.end{animation:pop .5s var(--spring) 3}
.conf{position:fixed;top:-40px;font-size:26px;z-index:99;pointer-events:none;animation:fall 1.7s cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(var(--rot));opacity:.9}}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 150px);transform:translate(-50%,30px);background:var(--text);color:var(--bg);border-radius:100px;padding:11px 20px;font-size:13px;opacity:0;transition:all .4s var(--spring);z-index:90;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ===== tema v2: oliva + terracota, tarjetas blandas y acento manuscrito ===== */
:root{--bg:#FAF2E8;--surface:#FFFBF5;--elevated:#EBE0D0;--border:rgba(70,50,20,.09);--text:#2C2B23;--muted:#6E695B;--hint:#A29A88;--accent:#C8643B;--accent-dark:#A65030;--olive:#5C6B3E;--olive-d:#4B5832;--script:'Sacramento','Snell Roundhand',cursive;--mono:'Inter',system-ui,sans-serif;--sh:0 10px 26px -14px rgba(80,55,20,.28)}
h1,h2,.ci h3,.gc h3{font-weight:500;letter-spacing:-.005em}
h1 em,h2 em,h3 em{font-family:var(--script);font-style:normal;font-weight:400;font-size:1.25em;line-height:.9;color:var(--accent);letter-spacing:0}
.lab{font-size:12px;letter-spacing:.01em;text-transform:none;font-weight:500}
.tag,.tupb{font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:500}
.tag{color:var(--olive-d);background:rgba(92,107,62,.11);border-color:transparent}
.solid{background:var(--accent);color:#fff;box-shadow:0 12px 22px -12px rgba(200,100,59,.75)}
.acc{background:var(--olive);color:#fff}
.ghost,.chip{background:var(--surface);border-color:var(--border)}
.chip.on{background:var(--olive);border-color:var(--olive);color:#fff}
.ico{background:var(--surface);border-color:transparent;box-shadow:var(--sh)}
.card,.gc,.box,.stats{background:var(--surface);border-color:transparent;border-radius:18px;box-shadow:var(--sh)}
.art{border-radius:50%;background:radial-gradient(circle,#fff 0 50%,transparent 51%),radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),transparent 60%),var(--c);border:none;box-shadow:0 8px 14px -9px rgba(60,40,10,.5)}
.gc .art,.rec .art{border-radius:14px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.65),transparent 60%),var(--c);box-shadow:none}
.bud{background:var(--olive);color:#fff;border:none;border-radius:20px;box-shadow:0 16px 30px -18px rgba(75,88,50,.9)}
.bud .big{font-weight:500}
.bud .row{border:none;padding:0;cursor:default}
.bud .meta,.bud .note,.bud .lab{color:rgba(255,255,255,.8)!important}
.bud .bar{background:rgba(255,255,255,.22)}.bud .bar i{background:#fff}
.bud.over .big{color:#FFD9C7}.bud.over .bar i{background:#FFB796}
.day.on,.dp.on{background:var(--olive);color:#fff}
.day.on .lab{color:rgba(255,255,255,.78)}
.day b,.dp{font-weight:500}
.dp{background:var(--surface);border-color:var(--border)}
.dp.on .ck{background:#fff;border-color:#fff}.dp.on .ck svg{stroke:var(--olive)}
.ck svg{stroke:#fff}
.row.on .ck,.meal.on .ck{background:var(--olive);border-color:var(--olive)}
.meal{background:var(--surface);border-color:transparent;border-radius:18px;box-shadow:var(--sh)}
.meal.on{background:#fff;border-color:var(--olive)}
.meal b,.stats b{font-weight:500}
#tabs{background:var(--olive);border:none;box-shadow:0 14px 30px -12px rgba(60,72,38,.75);border-radius:26px}
#tabs::before{background:rgba(255,255,255,.17);border-radius:21px}
#tabs button{color:rgba(255,255,255,.64);font-size:10.5px;letter-spacing:0;text-transform:none;font-weight:500;gap:4px}
#tabs button.on{color:#fff}
#tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--spring)}
#tabs button.on svg{transform:scale(1.14) translateY(-1px)}
.badge{background:var(--accent);color:#fff;font-style:normal;top:2px}
.seg{background:var(--surface);border-color:var(--border)}.seg::before{background:var(--olive)}.seg button.on{color:#fff}
.hero{border-radius:22px;border:none}.hero .ico,.hero .price{background:var(--surface);border:none;box-shadow:var(--sh)}
.tupb{background:var(--surface);border-color:var(--border)}
.tupb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tip{background:rgba(92,107,62,.10);border-color:transparent;color:var(--olive-d);border-radius:14px}
.inp,.search{background:var(--surface);border-color:var(--border)}
.prog i::after{background:var(--olive)}
input[type=range]{background:linear-gradient(var(--olive),var(--olive)) 0/var(--p,50%) 100% no-repeat,var(--elevated)}
input[type=range]::-webkit-slider-thumb{background:#fff;border:2px solid var(--olive)}
input[type=range]::-moz-range-thumb{background:#fff;border:2px solid var(--olive)}
.pstep .num{font-family:var(--script);font-style:normal;font-size:36px}
.bignum{font-weight:500}.bignum sup{font-family:var(--script);font-style:normal;font-size:40px}
.cook .txt{font-weight:500}.cook .ghostnum{font-style:normal;color:var(--olive)}
.timer.run{background:var(--olive);color:#fff}
#toast{background:var(--olive-d);color:#fff}
.macro i:nth-child(1){background:var(--olive)!important}.macro i:nth-child(3){background:#DCCBA8!important}
.sheet,.sfoot{background:var(--bg)}
.go{background:var(--surface);border-color:transparent;box-shadow:var(--sh)}
.fab .ghost{background:var(--surface)!important}
.plate{background:radial-gradient(circle at 35% 30%,#fff,#F3E8DA 70%)}
/* perfil y avatar */
.av{width:var(--s);height:var(--s);border-radius:50%;background:var(--elevated);display:grid;place-items:center;font-family:var(--serif);font-size:calc(var(--s)*.42);color:var(--olive-d);position:relative;flex-shrink:0;box-shadow:0 0 0 3px var(--surface),var(--sh);cursor:pointer;transition:transform .25s var(--spring)}
.av:active{transform:scale(.94)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .cam{position:absolute;right:-2px;bottom:-2px;width:32px;height:32px;border-radius:50%;background:var(--olive);display:grid;place-items:center;box-shadow:0 0 0 3px var(--bg)}
.av .cam svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linejoin:round}
.av input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.streak{display:flex;align-items:center;justify-content:space-between;gap:10px}
.streak .big{font-size:30px}
.sdots{display:flex;gap:6px}
.sdots span{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,.8)}
.sdots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;transition:background .4s}
.sdots i.on{background:#fff}
.sdots i.on::after{content:'';width:8px;height:4px;border-left:2px solid var(--olive);border-bottom:2px solid var(--olive);transform:rotate(-45deg) translate(1px,-1px)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);text-align:left;transition:transform .2s var(--spring)}
.tile:active{transform:scale(.97)}
.tile b{font-family:var(--serif);font-weight:500;font-size:27px;display:block;line-height:1.1;margin-top:8px}
.tile b small{font-family:var(--sans);font-size:12px;color:var(--hint);font-weight:400;margin-left:4px}
.rec{width:116px;flex-shrink:0;text-align:left;cursor:pointer}
.rec .art{width:116px;height:92px;font-size:44px;margin-bottom:7px}
.rec b{font-size:12.5px;font-weight:500;line-height:1.25;display:block}
/* fotos de plato: se pintan encima del emoji; si la imagen no carga, se ve el emoji */
.art,.hero{position:relative;overflow:hidden}
.art.ph::after,.hero.ph::after{content:'';position:absolute;inset:0;background:var(--img) center/cover no-repeat;border-radius:inherit}
.art.ph{background:var(--c);border-radius:16px}
.card .art{width:84px;height:84px}
.gc .art{height:128px}
.hero.ph{height:270px}
.hero .ico,.hero .price{z-index:1}
.fphoto{display:flex;align-items:center;gap:12px}
.fphoto .art{width:72px;height:72px;flex-shrink:0}
.fphoto label{position:relative;overflow:hidden}
.fphoto input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

const DEF={ob:0,people:2,budget:80,meals:{b:1,l:1,s:0,d:1},days:[1,1,1,1,1,1,1],diet:'omni',nogluten:0,nolact:0,avoid:[],store:'mercadona',plan:{},serv:{},chk:{},fav:[],cooked:{},avoidIng:[],custom:[],cing:{},tup:{},name:'',photo:'',cookDays:{},cookN:0,recent:[],kids:[],nutfree:1,skip:{}};
const KEY='sazon.v1';
const fresh=()=>JSON.parse(JSON.stringify(DEF));
let S=(()=>{try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY))||{})}catch(e){return fresh()}})();
Object.assign(ING,S.cing);S.custom.forEach(x=>{R.push(x);RID[x.id]=x});
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const unesc=t=>String(t).replace(/&(amp|lt|gt|quot|#39);/g,(m,c)=>({amp:'&',lt:'<',gt:'>',quot:'"','#39':"'"}[c]));
const norm=t=>unesc(t).replace(/ \(.*\)/,'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=(new Date().getDay()+6)%7;
const U={tab:'semana',day:today,step:0,filter:'all',q:'',det:null,seg:0,reset:0,form:null};
const monday=(()=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-today);return d})();
const dateOf=i=>{const d=new Date(monday);d.setDate(d.getDate()+i);return d};
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* ============ LÓGICA ============ */
const $=(s,el=document)=>el.querySelector(s);
const eur=x=>x.toFixed(2).replace('.',',')+' €';
const unitPrice=id=>ING[id][3]==='ud'?ING[id][4]:ING[id][4]/1000;
const costPP=x=>x.ing.reduce((a,[id,q])=>a+(ING[id][6]?0:q*unitPrice(id)),0);
const tint=x=>TINTS[R.indexOf(x)%TINTS.length];
// foto del plato: las del catálogo viven en img/<id>.jpg; las recetas propias pueden llevar la suya (data URL)
const imgOf=x=>x.img||(x.custom?'':`img/${x.id}.jpg`);
const art=x=>`<div class="art ${imgOf(x)?'ph':''}" style="--c:${tint(x)}${imgOf(x)?`;--img:url(${imgOf(x)})`:''}">${x.e}</div>`;
function groups(x){return new Set(x.ing.map(([id])=>ING[id][5]).filter(Boolean))}
function dietOf(x){const g=groups(x);if(g.has('carne')||g.has('pescado'))return'';return(g.has('lacteo')||g.has('huevo')||g.has('miel'))?'Vegetariano':'Vegano'}
function allowed(x){const g=groups(x);
  if(S.diet!=='omni'&&(g.has('carne')||g.has('pescado')))return false;
  if(S.diet==='vegan'&&(g.has('lacteo')||g.has('huevo')||g.has('miel')))return false;
  if(S.nogluten&&g.has('gluten'))return false;
  if(S.nolact&&g.has('lacteo'))return false;
  for(const k of S.avoid){const f=AVOID.find(a=>a[0]===k);if(f&&x.ing.some(([id])=>f[3](id)))return false}
  if(x.ing.some(([id])=>S.avoidIng.includes(id)))return false;
  return true}
// ración por edad respecto a la base (10–12 años)
const ageF=a=>a<=5?.6:a<=9?.8:a<=12?1:1.2;
const kidsF=()=>S.kids.reduce((t,k)=>t+ageF(k.a),0);
const minKid=()=>S.kids.length?Math.min(...S.kids.map(k=>k.a)):99;
// ¿esta comida se planifica este día? El almuerzo del cole solo de lunes a viernes y si hay peques
const on=(d,s)=>s==='k'?S.kids.length>0&&d<5:!!S.meals[s];
const kidOk=x=>x.minAge<=minKid()&&!(S.nutfree&&groups(x).has('fsecos'));
const pool=(slot,d)=>R.filter(x=>x.t.includes(slot)&&allowed(x)&&(slot!=='k'||kidOk(x))&&(d==null||!S.tup[d+slot]||x.tp));
const usedSet=()=>{const u=new Set();Object.values(S.plan).forEach(d=>Object.values(d).forEach(id=>u.add(id)));return u};
function pick(d,slot,used,not){let p=pool(slot,d).filter(x=>x.id!==not);if(!p.length)return null;const f=p.filter(x=>!used.has(x.id));if(f.length)p=f;const mine=f.filter(x=>x.custom);if(mine.length&&Math.random()<.5)p=mine;const x=p[Math.random()*p.length|0];used.add(x.id);return x.id}
const servOf=(d,s)=>S.serv[d+s]||(s==='k'?kidsF()||1:S.people);
function entries(){const o=[];for(let d=0;d<7;d++)if(S.plan[d])for(const[s]of ALL){const x=RID[S.plan[d][s]];if(x)o.push({d,s,x,n:servOf(d,s)})}return o}
const total=()=>entries().reduce((a,e)=>a+costPP(e.x)*e.n,0);
function fitBudget(){let g=80;while(total()>S.budget&&g--){const es=entries().map(e=>({...e,c:costPP(e.x),alt:pool(e.s,e.d).filter(y=>costPP(y)<costPP(e.x)-.05)})).filter(e=>e.alt.length).sort((a,b)=>b.c*b.n-a.c*a.n);if(!es.length)break;const e=es[Math.random()*Math.min(3,es.length)|0];const u=usedSet();const fresh=e.alt.filter(y=>!u.has(y.id));const a=(fresh.length?fresh:e.alt);S.plan[e.d][e.s]=a[Math.random()*a.length|0].id}}
function generate(){S.plan={};S.serv={};S.chk={};S.cooked={};const u=new Set();for(let d=0;d<7;d++)if(S.days[d]){S.plan[d]={};for(const[s]of ALL)if(on(d,s)&&!S.skip[d+s]){const id=pick(d,s,u);if(id)S.plan[d][s]=id}}fitBudget();save()}
function syncPlan(){const u=usedSet();for(let d=0;d<7;d++){if(!S.days[d]){delete S.plan[d];continue}S.plan[d]=S.plan[d]||{};for(const[s]of ALL){const cur=RID[S.plan[d][s]];if(!on(d,s)||S.skip[d+s])delete S.plan[d][s];else if(!cur||!allowed(cur)||(s==='k'&&!kidOk(cur))||(S.tup[d+s]&&!cur.tp)){delete S.cooked[d+s];delete S.serv[d+s];const id=pick(d,s,u);if(id)S.plan[d][s]=id;else delete S.plan[d][s]}}}save()}
function shopping(){const m={};entries().forEach(e=>e.x.ing.forEach(([id,q])=>{m[id]=(m[id]||0)+q*e.n}));
  return Object.entries(m).map(([id,q])=>{const I=ING[id];const price=I[6]?0:(I[3]==='ud'?Math.ceil(q-1e-9)*I[4]:q*I[4]/1000);return{id,q,price,pantry:!!I[6],aisle:I[2]}})}
function frac(x){let w=Math.floor(x+1e-9),q=Math.round((x-w)*4);if(q===4){w++;q=0}if(!w&&!q)q=1;return(w||'')+['','¼','½','¾'][q]}
function qty(id,q,list){const u=ING[id][3];if(!q)return'al gusto';
  if(u==='ud')return(list?Math.ceil(q-1e-9):frac(q))+' ud';
  const big=u==='g'?'kg':'l';if(q>=1000)return(q/1000).toFixed(1).replace('.',',').replace(',0','')+' '+big;
  return(q<20?Math.round(q):Math.round(q/5)*5)+' '+u}
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n||8)}catch(e){}};
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1900)}
function countTo(el,to,fmt){if(!el)return;const from=+el.dataset.v||0;el.dataset.v=to;const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);el.textContent=fmt(from+(to-from)*e);if(k<1)requestAnimationFrame(f)})(t0)}
function confetti(){const em=['🥕','🍅','🥦','🍋','🧄','🌿','🍆','🥑','✨'];for(let i=0;i<26;i++){const s=document.createElement('span');s.className='conf';s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.setProperty('--rot',(Math.random()*720-360)+'deg');s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2300)}}
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function streak(){const d=new Date();d.setHours(12,0,0,0);if(!S.cookDays[dkey(d)])d.setDate(d.getDate()-1);let n=0;while(S.cookDays[dkey(d)]){n++;d.setDate(d.getDate()-1)}return n}
const CAM='<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
function av(sz,edit){const inner=S.photo?`<img src="${S.photo}" alt="">`:(S.name?esc(S.name.trim()[0].toUpperCase()):'👩‍🍳');return edit?`<label class="av" style="--s:${sz}px">${inner}<span class="cam">${CAM}</span><input type="file" accept="image/*" id="ph" aria-label="Cambiar foto"></label>`:`<div class="av" style="--s:${sz}px" data-a="tab" data-v="perfil">${inner}</div>`}
const TICK='<span class="ck"><svg viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7"/></svg></span>';

/* ============ CONTROLES COMPARTIDOS (onboarding + ajustes) ============ */
const C={
people:()=>`<div class="box"><div class="line"><div><b style="font-family:var(--serif);font-size:17px">Cocinas para</b><div class="meta">${S.people} ${S.people>1?'personas':'persona'}</div></div><div class="step"><button data-a="ppl" data-v="-1">−</button><b class="tick" style="font-family:var(--serif);font-size:22px;text-align:center">${S.people}</b><button data-a="ppl" data-v="1">+</button></div></div></div>`,
budget:()=>`<div class="bignum"><span id="bn">${S.budget}</span><sup>€</sup></div><div class="lab" style="text-align:center">a la semana · toda la compra</div><input type="range" id="rng" min="20" max="300" step="5" value="${S.budget}" style="--p:${(S.budget-20)/280*100}%"><div class="line meta"><span>20 €</span><span>300 €</span></div>`,
meals:()=>SLOTS.map(([k,n,e,d])=>`<button class="meal ${S.meals[k]?'on':''}" data-a="meal" data-v="${k}"><span class="e">${e}</span><div><b>${n}</b><small>${d}</small></div>${TICK}</button>`).join(''),
days:()=>`<div class="dpills">${DAYS.map((d,i)=>`<button class="dp ${S.days[i]?'on':''}" data-a="dayt" data-v="${i}">${d[0]==='M'&&i===2?'X':d[0]}${TICK}</button>`).join('')}</div><p class="meta" style="text-align:center;margin-top:14px">${S.days.filter(Boolean).length} días a la semana</p>`,
diet:()=>`<div class="chips">${[['omni','Como de todo'],['veg','Vegetariana'],['vegan','Vegana']].map(([k,n])=>`<button class="chip ${S.diet===k?'on':''}" data-a="diet" data-v="${k}">${n}</button>`).join('')}<button class="chip ${S.nogluten?'on':''}" data-a="flag" data-v="nogluten">Sin gluten</button><button class="chip ${S.nolact?'on':''}" data-a="flag" data-v="nolact">Sin lácteos</button></div>`,
avoid:()=>`<input class="search" id="aq" placeholder="Busca cualquier ingrediente" style="margin-top:0" autocomplete="off"><div class="chips" id="ar" style="margin-bottom:10px"></div><div class="chips">${S.avoidIng.filter(id=>ING[id]).map(id=>`<button class="chip on" data-a="avoidi" data-v="${id}">${ING[id][1]} ${ING[id][0]} ✕</button>`).join('')}${AVOID.map(([k,n,e])=>`<button class="chip ${S.avoid.includes(k)?'on':''}" data-a="avoid" data-v="${k}">${e} ${n}</button>`).join('')}</div>`,
tup:()=>`<div class="dpills">${DAYS.map((d,i)=>`<button class="dp ${S.tup[i+'l']?'on':''}" data-a="tupd" data-v="${i}">${i===2?'X':d[0]}${TICK}</button>`).join('')}</div><p class="meta" style="text-align:center;margin-top:14px">Esos días la comida será un plato que aguanta en táper y se recalienta bien.</p>`,
kids:()=>`${S.kids.map((k,i)=>`<div class="box" style="margin-bottom:8px;padding:10px 12px"><div class="line"><input class="inp knm" data-i="${i}" placeholder="Nombre" maxlength="16" value="${esc(k.n)}" style="padding:9px 12px"><div class="step" style="flex-shrink:0"><button data-a="kage" data-i="${i}" data-v="-1">−</button><b style="font-family:var(--serif);font-size:18px;min-width:52px;text-align:center">${k.a} años</b><button data-a="kage" data-i="${i}" data-v="1">+</button></div><button data-a="kdel" data-v="${i}" aria-label="Quitar" style="padding:6px;color:var(--hint)">✕</button></div></div>`).join('')}<div class="chips"><button class="chip" data-a="kadd">＋ Añadir peque</button>${S.kids.length?`<button class="chip ${S.nutfree?'on':''}" data-a="flag" data-v="nutfree">🥜 Cole sin frutos secos</button>`:''}</div><p class="meta" style="margin-top:10px">${S.kids.length?'Planificamos su almuerzo de lunes a viernes, con raciones y platos según su edad.':'Si añades peques, planificamos su almuerzo del cole de lunes a viernes según su edad.'}</p>`,
store:()=>`<div class="chips">${Object.entries(STORES).map(([k,[n]])=>`<button class="chip ${S.store===k?'on':''}" data-a="store" data-v="${k}">${n}</button>`).join('')}</div>`
};

/* ============ ONBOARDING ============ */
const OB=[
 null,
 ['¿Cómo te <em>llamas</em>?','Pon tu nombre y, si quieres, una foto. Es tu cocina.',()=>`<div style="display:grid;place-items:center;gap:22px;margin-top:10px">${av(132,1)}<input class="inp" id="nm" placeholder="Tu nombre" maxlength="24" value="${esc(S.name)}" style="text-align:center;font-size:18px" autocomplete="given-name"><p class="meta">La foto se guarda solo en tu móvil.</p></div>`],
 ['¿Para cuántos y con qué <em>presupuesto</em>?','Ajustamos los platos para que la compra de la semana no se pase.',()=>C.budget()+'<div style="height:22px"></div>'+C.people()],
 ['¿Qué comidas <em>planificamos</em>?','Elige las que quieras. La merienda es opcional y puedes cambiarlo después.',()=>C.meals()+'<div class="lab sec">🎒 Almuerzo del cole</div>'+C.kids()],
 ['¿Qué días <em>cocinas</em>?','Toca los días en los que quieres tener el menú resuelto.',()=>C.days()+(S.meals.l?'<div class="lab sec">🥡 ¿Qué días te llevas la comida en táper?</div>'+C.tup():'')],
 ['¿Cómo <em>comes</em>?','Tu dieta y lo que prefieres no ver en el plato.',()=>C.diet()+'<div class="lab sec">Prefiero evitar</div>'+C.avoid()],
 ['¿Dónde haces la <em>compra</em>?','Lo usamos para llevarte al buscador de tu súper desde la lista.',C.store]
];
function vOnb(){const i=U.step;
 if(!i)return`<div class="ob"><div class="welcome"><div class="plate"><span>🍲</span><i style="top:-14px;left:8px;--r:-14deg">🥑</i><i style="top:6px;right:-12px;--r:12deg;animation-delay:.6s">🍅</i><i style="bottom:10px;left:-18px;--r:8deg;animation-delay:1.1s">🥕</i><i style="bottom:-12px;right:14px;--r:-8deg;animation-delay:1.6s">🍋</i></div><div><div class="lab">Sazón · tu menú semanal</div><h1 style="font-size:44px;margin-top:10px"><em>Come bien,</em><br>sin pensar</h1><p class="sub" style="max-width:300px;margin:12px auto 0">Desayuno, comida, merienda y cena de toda la semana, con su lista de la compra y dentro de tu presupuesto.</p></div></div><div class="foot"><button class="btn solid wide" data-a="next">Empezar →</button></div></div>`;
 const[t,s,f]=OB[i];const ok=i===3?Object.values(S.meals).some(Boolean):i===4?S.days.some(Boolean):true;
 return`<div class="ob"><div class="top"><button class="ico" data-a="back">←</button><div class="prog">${OB.slice(1).map((_,k)=>`<i class="${k<i?'on':''}"></i>`).join('')}</div><span class="lab">${i}/${OB.length-1}</span></div><div><h1>${t}</h1><p class="sub">${s}</p></div><div class="mid">${f()}</div><div class="foot"><button class="btn solid wide" data-a="next" ${ok?'':'disabled'}>${i===OB.length-1?'Crear mi menú →':'Continuar'}</button></div></div>`}
function runGen(){const g=document.createElement('div');g.className='gen';g.innerHTML=`<div class="pot">🍲<i></i><i></i><i></i></div><h2>Preparando tu <em>semana</em></h2><p class="lab" id="gm">Eligiendo platos…</p><div class="bar"><i id="gb"></i></div>`;document.body.appendChild(g);
 generate();const msgs=['Eligiendo platos…','Cuadrando el presupuesto…','Montando la lista de la compra…'];let k=0;requestAnimationFrame(()=>$('#gb').style.width='34%');
 const iv=setInterval(()=>{k++;if(k<3){$('#gm').textContent=msgs[k];$('#gb').style.width=(34+k*33)+'%'}else{clearInterval(iv);S.ob=1;save();U.tab='semana';U.day=S.days[today]?today:S.days.indexOf(1);render(true);g.style.transition='opacity .5s';g.style.opacity=0;setTimeout(()=>g.remove(),500)}},750)}

/* ============ VISTAS ============ */
function tagsOf(x,max){const t=[x.tag];if(x.min<=15&&x.tag!=='Rápido')t.push('Rápido');const d=dietOf(x);if(d)t.push(d);return t.slice(0,max||2).map(s=>`<span class="tag">${s}</span>`).join('')}
function cardHTML(d,s,cls){const x=RID[S.plan[d]&&S.plan[d][s]];if(!x)return`<div class="empty">Sin opciones con tus filtros${S.tup[d+s]?' para táper':''}. Revisa tus ajustes.</div>`;
 const done=S.cooked[d+s];
 return`<article class="card ${cls||''} ${done?'done':''}" data-a="open" data-d="${d}" data-s="${s}">${art(x)}<div class="ci"><div class="tags">${done?'<span class="tag">✓ Cocinado</span>':(S.tup[d+s]?'<span class="tag">🥡 Táper</span>':'')+tagsOf(x,S.tup[d+s]?1:2)}</div><h3>${x.n}</h3><p class="meta">${x.min} min · <b>${eur(costPP(x))}</b> /pers.</p></div><button class="ico" data-a="swap" data-d="${d}" data-s="${s}" aria-label="Cambiar plato">↻</button></article>`}
function dayBody(){const d=U.day,p=S.plan[d];const dt=dateOf(d);
 if(!p)return`<div class="free"><span class="e">🌿</span><h2 style="margin-top:10px">Día <em>libre</em></h2><p class="sub" style="margin:6px 0 18px">No hay nada planificado para el ${DAYS[d].toLowerCase()}.</p><button class="btn ghost" data-a="planday">Planificar este día</button></div>`;
 const es=entries().filter(e=>e.d===d);const kcal=es.reduce((a,e)=>a+e.x.kcal,0),c=es.reduce((a,e)=>a+costPP(e.x),0);
 return`<div class="dayhead"><h2>${DAYS[d]} <em>${dt.getDate()} ${MES[dt.getMonth()]}</em></h2><span class="lab">${kcal} kcal · ${eur(c)}/pers.</span></div>`+ALL.filter(([s])=>on(d,s)).map(([s,n,e],i)=>`<div class="slot lab"><span>${e} ${n}${s==='k'?' · '+S.kids.map(k=>esc(k.n||'Peque')+' ('+k.a+')').join(', '):''}</span>${S.skip[d+s]?'':`<span style="display:flex;gap:6px">${s==='l'||s==='d'?`<button class="tupb ${S.tup[d+s]?'on':''}" data-a="tup" data-s="${s}">🥡 Táper</button>`:''}<button class="tupb" data-a="skip" data-s="${s}">✕ Quitar</button></span>`}</div>`+(S.skip[d+s]?`<div class="empty">Quitada: no cuenta en el menú ni en la lista.<br><button class="lab" data-a="skip" data-s="${s}" style="color:var(--accent);margin-top:6px">↩ Recuperar esta comida</button></div>`:cardHTML(d,s)).replace('class="card','style="animation-delay:'+(i*.06)+'s" class="card')).join('')}
function budHTML(){const t=total(),n=entries().length,over=t>S.budget+.005;
 return`<div class="bud ${over?'over':''}" id="bud"><div class="row"><span class="big" id="bt" data-v="${budHTML.last||0}">${eur(budHTML.last||0)}</span><span class="meta">de ${S.budget} € · ${n} platos · ${S.people} pers.</span></div><div class="bar"><i id="bb"></i></div><div class="line" style="margin-top:10px"><span class="lab">Presupuesto semanal</span><button class="lab" data-a="regen">↻ Regenerar menú</button></div>${over?`<p class="note">Te pasas ${eur(t-S.budget)}. Cambia algún plato o sube el presupuesto.</p>`:''}</div>`}
function budAnim(){const t=total();countTo($('#bt'),t,eur);budHTML.last=t;const b=$('#bb');if(b)requestAnimationFrame(()=>b.style.width=Math.min(100,t/S.budget*100)+'%')}
function vSemana(){const a=dateOf(0),b=dateOf(6);

function vLista(){const all=shopping(),buy=all.filter(i=>!i.pantry),pan=all.filter(i=>i.pantry);const tot=buy.reduce((a,i)=>a+i.price,0),done=buy.filter(i=>S.chk[i.id]).length;
